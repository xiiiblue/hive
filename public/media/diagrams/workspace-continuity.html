<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="通过三次采购对账任务，了解自己的AI工作空间怎样保留资料、工作进展和个人做法。">
  <link rel="canonical" href="https://www.bluexiii.com/hive/media/diagrams/workspace-continuity.html">
  <meta property="og:url" content="https://www.bluexiii.com/hive/media/diagrams/workspace-continuity.html">
  <link rel="stylesheet" href="diagram-atlas.css">
  <title>员工工作空间与连续工作图</title>
</head>
<body class="atlas-sheet">
<main>
<figure class="hive-atlas continuity-atlas" aria-labelledby="continuity-title">
  <figcaption class="continuity-head">
    <h1 class="atlas-title" id="continuity-title">自己的AI工作空间，<span>让每天的工作接得上</span></h1>
    <p>以采购对账为例。同一名员工开了三次对话，前一次留下的资料和做法，下一次还能继续用。</p>
  </figcaption>
  <ol class="continuity-timeline" role="list" aria-label="同一名员工的三次采购对账任务">
    <li>
      <span class="continuity-date">周一</span>
      <h2>先做出一份对账表</h2>
      <p>把采购订单和收货记录交给智能体，请它标出数量不一致的项目。核对后，把表格保存到自己的工作空间。</p>
      <div class="continuity-output"><small>留在工作空间</small><strong>原始资料和第一版对账表</strong></div>
    </li>
    <li>
      <span class="continuity-date">周三</span>
      <h2>开新对话，接着处理差异</h2>
      <p>收到补充凭证后，请智能体打开上次的表格，更新已确认的项目，再列出仍需跟进的差异。</p>
      <div class="continuity-output"><small>留在工作空间</small><strong>更新后的对账表和待跟进清单</strong></div>
    </li>
    <li>
      <span class="continuity-date">下个月</span>
      <h2>换一批订单，沿用做法</h2>
      <p>把核对规则和输出格式整理成个人技能，也就是一套可重复使用的步骤。处理新订单时，直接引用这套技能。</p>
      <div class="continuity-output"><small>留在工作空间</small><strong>个人对账技能和新一轮对账表</strong></div>
    </li>
  </ol>
  <div class="continuity-space">
    <strong>同一个人的AI工作空间</strong>
    <p>资料找得到，做到一半的事接得上，验证过的做法可以反复用。</p>
  </div>
</figure>
</main>
</body>
</html>
