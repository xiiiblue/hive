name: 构建并发布蜂巢网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出网站源码
        uses: actions/checkout@v7
      - name: 准备Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 类型、构建、全文检索与链接检查
        run: npm run check
      - name: 检查公开依赖
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
